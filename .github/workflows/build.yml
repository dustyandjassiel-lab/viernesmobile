name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🛠️ Instalar dependencias y arquitectura de 32 bits para SDK/aidl
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncursesw6 libffi-dev libssl-dev build-essential libltdl-dev libc6:i386 libstdc++6:i386 libz1:i386

    - name: 🚀 Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: 🏗️ Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: 📦 Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
