name: Compilar APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar con Buildozer
        uses: kivy/buildozer-action@master
        id: buildozer
        with:
          filename: buildozer.spec
          command: android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
